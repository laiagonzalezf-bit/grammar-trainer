<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammar Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Layout: home = grid of rule cards with mastery bars; session = one exercise card at a time with instant feedback */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#1c2230; --muted:#5d6676; --line:#dde2ea;
  --pen:#c2342b; --pen-soft:#fbe9e7; --ok:#1f7a4d; --ok-soft:#e3f3ea; --chip:#e9edf3; --accent:#2d4a8a; --accent-soft:#e6ecf8;
  --display:"Fraunces", Georgia, serif; --body:"Atkinson Hyperlegible", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151c; --surface:#1b202a; --ink:#e7eaf0; --muted:#9aa3b2; --line:#2c3340;
  --pen:#ff7a6e; --pen-soft:#3a1f1d; --ok:#5fd39a; --ok-soft:#173327; --chip:#262c38; --accent:#9db7ff; --accent-soft:#1f2a44; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1b202a; --ink:#e7eaf0; --muted:#9aa3b2; --line:#2c3340;
  --pen:#ff7a6e; --pen-soft:#3a1f1d; --ok:#5fd39a; --ok-soft:#173327; --chip:#262c38; --accent:#9db7ff; --accent-soft:#1f2a44; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:680px;margin:0 auto;display:grid;gap:16px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(24px,5vw,32px);margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:21px;margin:0}
p{margin:0}
.muted{color:var(--muted);font-size:14px}
button{font-family:var(--body);font-size:16px;cursor:pointer;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 16px}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.small{font-size:14px;padding:6px 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hero{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;text-align:left;font-size:15px}
.rule b{font-size:15px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:14px}
.tag{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:700}
.kind{font-size:13px;color:var(--muted)}
.q{font-size:clamp(19px,4.4vw,22px);line-height:1.4}
.opts{display:grid;gap:8px}
.opts button{text-align:left}
.opts button.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opts button.wrong{border-color:var(--pen);background:var(--pen-soft);color:var(--pen)}
input[type=text]{width:100%;min-width:0;font-family:var(--body);font-size:17px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.fb{border-radius:12px;padding:12px 14px;display:grid;gap:6px;font-size:15px}
.fb.good{background:var(--ok-soft)} .fb.bad{background:var(--pen-soft)}
.fb .h{font-weight:700} .good .h{color:var(--ok)} .bad .h{color:var(--pen)}
.reminder{background:var(--accent-soft);border-radius:12px;padding:14px 16px;display:grid;gap:8px;font-size:15px}
.reminder ul{margin:0;padding-left:20px;display:grid;gap:4px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.out{width:100%;min-height:110px;font-size:12px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
table.sum{width:100%;border-collapse:collapse;font-size:14px}
table.sum td{padding:6px 4px;border-bottom:1px solid var(--line)}
table.sum td:last-child{text-align:right;font-variant-numeric:tabular-nums}
</style>

<div class="wrap" id="app"></div>

<script>
// ---------- helpers ----------
const N=s=>s.toLowerCase().replace(/[’‘`]/g,"'").replace(/\bwon't\b/g,"will not").replace(/\bcan't\b/g,"cannot").replace(/n't\b/g," not").replace(/'ve\b/g," have").replace(/'re\b/g," are").replace(/\bi'm\b/g,"i am").replace(/'ll\b/g," will").replace(/[“”]/g,'"').replace(/\s+/g," ").replace(/[.!?]+$/,"").trim();
const C=(q,opts,a,why)=>({t:"choose",q,opts,a,why});
const G=(q,acc,why)=>({t:"gap",q,acc:acc.map(N),model:acc[0],why});
const F=(q,must,not,model,why)=>({t:"fix",q,must,not,model,why});
const OK=(q,why)=>({t:"ok",q,model:q,why});
const T=(q,must,not,model,why)=>({t:"tr",q,must,not,model,why});
const P=(q,models)=>({t:"para",q,models,model:models[0],why:"Comprueba: ¿has cambiado 2–3 cosas? ¿Significa exactamente lo mismo? ¿La gramática es correcta?"});
const A=(orig,acc,note)=>({t:"alt",orig,q:orig+"  →  …",acc:acc.map(N),models:acc,model:acc[0],why:(note?note+"<br>":"")+"Alternativas: <b>"+acc.join("</b> · <b>")+"</b>"});
const KIND={alt:"Escribe otra forma de decirlo (sin repetir las mismas palabras)",choose:"Elige la opción correcta",gap:"Escribe solo la palabra que falta (o la frase completa)",fix:"Esta frase tiene un error: reescríbela bien (o pulsa «Ya es correcta»)",ok:"Esta frase tiene un error: reescríbela bien (o pulsa «Ya es correcta»)",tr:"Tradúcela al inglés",para:"Parafrasea la frase, como en la introducción del ensayo"};
const ORDER={alt:1,choose:0,gap:1,fix:2,ok:2,tr:3,para:3};

// ---------- content ----------
const RULES=[
{id:"r1",name:"1 · Formas del verbo",tip:["Mira la palabra <b>justo antes</b> del verbo:","<b>to, did/didn't, will, would, can, should</b> → 1ª forma (<i>to become, didn't know</i>)","<b>have / has / had</b> → 3ª forma (<i>has fallen, have become</i>)","<b>be</b> + algo hecho → 3ª forma (<i>should be taught</i>)","nada delante + pasado terminado → 2ª forma (<i>prices fell in 2015</i>)"],items:[
 C("Rents have ___ a lot since 2020.",["rise","rose","risen"],"risen","Delante hay <b>have</b> → 3ª forma: rise – rose – <b>risen</b>."),
 C("Last year, prices ___ by 10%.",["fell","felt","fallen"],"fell","Pasado terminado (<i>last year</i>) → 2ª forma: fall – <b>fell</b>. <i>Felt</i> es de <i>feel</i> (sentir)."),
 G("I didn't ___ the answer. (know)",["know"],"<b>didn't</b> ya marca el pasado → 1ª forma: <i>didn't know</i>."),
 G("It's easy to ___ addicted to social media. (become)",["become"],"Después de <b>to</b> → 1ª forma: <i>to become</i>."),
 G("Music should be ___ in every school. (teach)",["taught"],"<b>be</b> + algo hecho → 3ª forma: teach – taught – <b>taught</b>. (<i>Thought</i> es de <i>think</i>.)"),
 G("If we gave it up, we would ___ something important. (lose)",["lose"],"Después de <b>would</b> → 1ª forma: <i>would lose</i>."),
 F("The number of tourists has became much higher.",[["has become"]],["has became"],"The number of tourists has become much higher.","<b>has</b> → 3ª forma: become – became – <b>become</b>."),
 F("When something brokes at home, it's expensive.",[["breaks"]],["brokes"],"When something breaks at home, it's expensive.","break es irregular: presente <b>breaks</b> (pasado <i>broke</i>)."),
 OK("Prices have risen sharply in recent years.","Correcta: <i>have</i> + <b>risen</b> (3ª forma)."),
 T("Los precios bajaron un 10% en 2015.",[["fell","dropped","decreased","declined"],["by 10%"]],["felt","have fallen","has fallen"],"Prices fell by 10% in 2015.","Fecha terminada → 2ª forma (<b>fell</b>), y el cambio va con <b>by</b>.")]},
{id:"r2",name:"2 · Tiempos verbales",tip:["<b>ago, in 2015, last year</b> → pasado simple (<i>went, rose</i>)","<b>since, for, recently, in recent years</b> → <i>have/has</i> + 3ª (<i>have risen</i>)","<b>used to</b> = hábito pasado que ya no haces · <b>usually</b> = hábito de ahora","Después de <b>when / if / until</b> hablando del futuro → presente, sin <i>will</i>"],items:[
 C("Two years ago, we ___ to New York.",["have gone","went","go"],"went","<b>ago</b> → pasado simple: <i>went</i>."),
 C("Rents ___ since 2015.",["rose","have risen"],"have risen","<b>since</b> → del pasado hasta hoy: <i>have risen</i>."),
 C("I ___ walk my dog on the beach on Saturdays. (lo haces ahora)",["used to","usually"],"usually","Hábito de ahora → <b>usually</b>. <i>Used to</i> es solo para el pasado."),
 C("I want to feel well when I ___ 50.",["will be","am"],"am","Después de <b>when</b> hablando del futuro → presente: <i>when I'm 50</i>."),
 G("By 2020, the price ___ ___ . (double)",["had doubled"],"<b>By</b> + año pasado → <i>had</i> + 3ª forma: <b>had doubled</b>."),
 F("I used to try to catch up on chores every Saturday. (lo sigues haciendo)",[["usually"]],["used to"],"I usually try to catch up on chores every Saturday.","Lo haces <b>ahora</b> → <i>usually</i>, no <i>used to</i>."),
 OK("I used to live in Horta when I was a child.","Correcta: ya no vives allí → <b>used to</b>."),
 T("Te llamaré cuando llegue a casa.",[["when i get home"]],["will get","when i will"],"I'll call you when I get home.","Después de <b>when</b> → presente: <i>when I get home</i>.")]},
{id:"r3",name:"3 · Uno o más (-s)",tip:["Busca <b>quién</b> hace la acción y <b>tapa con el dedo</b> las palabras de en medio","<b>Uno</b> → verbo + s (<i>has, is, does, needs</i>) · <b>varios</b> → sin s","<b>people</b> = varios · <b>everyone, every, the number of, the main cause</b> = uno"],items:[
 C("People who live downtown ___ more.",["pay","pays"],"pay","<b>People</b> = varios → <i>pay</i>."),
 C("The number of cars ___ fallen.",["have","has"],"has","<b>The number</b> = uno → <i>has</i>."),
 C("Everyone ___ some time alone.",["need","needs"],"needs","<b>Everyone</b> = uno → <i>needs</i>."),
 C("The need to share living costs and responsibilities ___ the advantages.",["outweigh","outweighs"],"outweighs","Tapa el medio: <b>the need</b> = uno → <i>outweighs</i>."),
 F("People is worried about rising rents.",[["people are"]],["people is"],"People are worried about rising rents.","<b>People</b> = varios → <i>are</i>."),
 F("A country that do not invest in culture loses jobs.",[["does not","doesn't"]],["that do not","that don't"],"A country that does not invest in culture loses jobs.","<b>A country</b> = uno → <i>does</i>."),
 F("The main cause of traffic jams are deliveries.",[["jams is"]],["jams are"],"The main cause of traffic jams is deliveries.","<b>The main cause</b> = uno → <i>is</i>."),
 OK("A lot of people come to Barcelona every summer.","Correcta: <i>a lot of people</i> = varios → <b>come</b>."),
 T("La gente que vive en el centro paga alquileres altos.",[["people who live","people living","people that live"],["pay"]],["pays","who lives","people is"],"People who live downtown pay high rents.","<b>People</b> = varios → <i>live</i>, <i>pay</i> (sin -s).")]},
{id:"r4",name:"4 · Contable o no",tip:["Incontables (nunca -s, nunca <i>a</i>): <b>advice, information, furniture, employment, seating, research, traffic, progress</b>","Contables: <b>many, fewer, the number of</b> · incontables: <b>much, less, the amount of</b>","Plurales raros: <b>life → lives</b>, child → children"],items:[
 C("He gave me some useful ___.",["advice","advices"],"advice","<b>advice</b> es incontable: nunca -s."),
 C("I'd like to work ___ hours.",["less","fewer"],"fewer","Las horas se cuentan → <b>fewer</b>."),
 C("Their ___ have changed a lot.",["lifes","lives"],"lives","life → <b>lives</b> (como knife → knives)."),
 C("the ___ of time we spend online",["number","amount"],"amount","<i>time</i> no se cuenta → <b>amount</b>."),
 G("We bought new ___ for the flat. (muebles)",["furniture"],"<b>furniture</b>: incontable, sin -s."),
 F("Festivals create a lot of temporary employments.",[["employment","jobs"]],["employments"],"Festivals create a lot of temporary employment.","<b>employment</b> no tiene plural (o usa <i>jobs</i>)."),
 F("The café added an outdoor seatings.",[["outdoor seating"]],["seatings"],"The café added outdoor seating.","<b>seating</b> es incontable: sin -s (o <i>an outdoor seating area</i>)."),
 OK("There is less traffic on Sundays.","Correcta: <i>traffic</i> no se cuenta → <b>less</b>."),
 T("Me dio varios consejos útiles.",[["pieces of advice","advice"]],["advices"],"He gave me several useful pieces of advice.","Para contar <i>advice</i>: <b>pieces of advice</b>.")]},
{id:"r5",name:"5 · Artículos",tip:["En <b>general</b> (plural o incontable) → nada: <i>Culture matters. People need space.</i>","<b>Una</b> cosa nueva → <b>a / an</b>: <i>a yard, an apartment</i>","Algo <b>concreto o único</b> → <b>the</b>: <i>the countryside, the world, the US</i>","Sin artículo: <b>at university / at school / at home</b>, y antes de posesivos (<i>today's plan</i>)"],items:[
 C("___ is important for society.",["The culture","Culture"],"Culture","Cultura <b>en general</b> → sin artículo."),
 C("I studied music at ___ university.",["the","(nada)"],"(nada)","Caso fijo: <b>at university</b>, sin <i>the</i>."),
 C("She lives in ___ US.",["the","(nada)"],"the","Países con <i>States</i> → <b>the US</b>."),
 C("They live in a house with ___ yard.",["a","the","(nada)"],"a","Una cosa → <b>a</b> yard."),
 F("I prefer living in countryside.",[["the countryside"]],["in countryside"],"I prefer living in the countryside.","Único → <b>the</b> countryside."),
 F("On the left side of the today's plan, there is a bar.",[["of today's plan"]],["the today's"],"On the left side of today's plan, there is a bar.","Antes de un posesivo (<i>today's</i>) no va <i>the</i>."),
 OK("People need green spaces in cities.","Correcta: en general → sin artículo."),
 T("La tecnología tiene un gran impacto en la educación.",[["impact on education"]],["the education","impact in","impact to"],"Technology has a big impact on education.","Educación en general → sin <i>the</i>; y <b>impact on</b>.")]},
{id:"r6",name:"6 · Formas de palabra",tip:["Al lado de un <b>sustantivo</b> → adjetivo: <i>a dramatic change</i>","Al lado de un <b>verbo</b> → adverbio -ly: <i>it changed dramatically</i>","<b>economic</b> = de la economía · <b>economical</b> = barato","Español <i>-cional</i> → inglés <b>-tional</b>"],items:[
 C("the ___ crisis",["economy","economic","economical"],"economic","Al lado de <i>crisis</i> → adjetivo; de la economía → <b>economic</b>."),
 C("a more ___ car (más barato)",["economic","economical"],"economical","Que ahorra dinero → <b>economical</b>."),
 C("Prices rose ___ in 2020.",["dramatic","dramatical","dramatically"],"dramatically","Al lado de un verbo (<i>rose</i>) → <b>-ly</b>."),
 C("a ___ space for learning",["democratic","democratical"],"democratic","<b>democratic</b> (como <i>dramatic</i>). <i>Democratical</i> no existe."),
 G("Teachers need a lot of ___. (PATIENT)",["patience"],"Después de <i>a lot of</i> → sustantivo: <b>patience</b>."),
 G("There was a ___ increase in rents. (SIGNIFY)",["significant"],"Al lado de <i>increase</i> → adjetivo: <b>significant</b>."),
 F("The topic was learned meaningful.",[["meaningfully"]],[],"The topic was learned meaningfully.","Al lado de un verbo (<i>learned</i>) → adverbio: <b>meaningfully</b>."),
 T("Las tradiciones nacionales son importantes.",[["national traditions"]],["nacional","tradicion"],"National traditions are important.","<i>-cional</i> → <b>-tional</b>: national, traditional.")]},
{id:"r7",name:"7 · -ing o to",tip:["Después de <b>preposición</b> (without, by, about, of, from, instead of) → <b>-ing</b>","Acción al <b>principio</b> de la frase → <b>-ing</b>: <i>Living alone…</i>","<b>enjoy, avoid, keep, finish, consider</b> + -ing · <b>want, decide, manage, afford, need</b> + to","<b>make / let</b> + 1ª forma sin <i>to</i> · <b>when it comes to</b> + -ing"],items:[
 C("I'm thinking about ___ abroad.",["study","to study","studying"],"studying","Después de <b>about</b> (preposición) → <i>-ing</i>."),
 C("I decided ___ for the master's.",["applying","to apply"],"to apply","<b>decide</b> + <i>to</i>."),
 C("Teachers make students ___.",["think","to think","thinking"],"think","<b>make</b> + 1ª forma, sin <i>to</i>."),
 C("I enjoy ___ on the couch.",["to read","reading"],"reading","<b>enjoy</b> + <i>-ing</i>."),
 G("When it comes to ___ alone, there are advantages. (live)",["living"],"Excepción: <b>when it comes to</b> + <i>-ing</i>."),
 G("Can we keep ___? (practice)",["practicing","practising"],"<b>keep</b> + <i>-ing</i>."),
 F("Without share an apartment, living in Barcelona is expensive.",[["without sharing"]],["without share "],"Without sharing an apartment, living in Barcelona is expensive.","<i>sin compartir</i> → preposición + <b>-ing</b>."),
 F("I avoid to think about the costs.",[["avoid thinking"]],["avoid to"],"I avoid thinking about the costs.","<b>avoid</b> + <i>-ing</i>."),
 F("They create jobs while also attract visitors.",[["while also attracting"]],[],"They create jobs while also attracting visitors.","<b>while</b> + <i>-ing</i>."),
 OK("I managed to finish the essay in time.","Correcta: <b>manage</b> + <i>to</i>."),
 T("Vivir solo tiene ventajas.",[["living alone has"]],["to live alone has"],"Living alone has advantages.","Acción al principio → <b>-ing</b>."),
 T("Conseguí terminar el examen.",[["managed to finish"]],[],"I managed to finish the exam.","<i>conseguir</i> → <b>managed to</b> + 1ª forma.")]},
{id:"r8",name:"8 · Palabras con pareja",tip:["Apréndelas como <b>bloque</b>: <i>impact on, related to, invest in, a rise in, consequences for, satisfied with, out of, addicted to</i>","Sin preposición: <b>attend, enjoy, affect, discuss, face, lack</b> (verbo), <b>impact</b> (verbo)"],items:[
 G("Tourism has a big impact ___ rents.",["on"],"<b>impact on</b> (sustantivo)."),
 G("Stress is related ___ long working hours.",["to"],"<b>related to</b>, nunca <i>with</i>."),
 G("Cities should invest ___ culture.",["in"],"<b>invest in</b>."),
 G("There was a sharp rise ___ rents.",["in"],"<b>a rise in</b>."),
 G("It has serious consequences ___ society.",["for"],"<b>consequences for</b>."),
 G("I'm satisfied ___ my progress.",["with"],"<b>satisfied with</b>."),
 G("Many people are priced out ___ the city center.",["of"],"<b>out of</b>."),
 C("I ___ a workshop last Saturday.",["attended to","attended"],"attended","<b>attend</b> no lleva preposición."),
 C("Online deliveries ___ our cities.",["impact on","impact"],"impact","<i>impact</i> como <b>verbo</b> → sin <i>on</i>."),
 F("It's easy to become addicted on social media.",[["addicted to"]],["addicted on"],"It's easy to become addicted to social media.","<b>addicted to</b>."),
 OK("Noise affects concentration.","Correcta: <b>affect</b> sin preposición."),
 T("Depende del contexto.",[["depends on"]],["depends of"],"It depends on the context.","<b>depend on</b>, no <i>of</i>.")]},
{id:"r9",name:"9 · Orden de palabras",tip:["<b>also, always, never, usually</b> → delante del verbo principal; detrás de <i>is/are</i>","Pregunta <b>dentro</b> de una frase → orden normal: <i>what <b>life is</b> like</i>","¿cómo es…? → <b>what… is like</b>"],items:[
 C("I don't know what ___ like.",["is life","life is"],"life is","Dentro de una frase → la cosa + el verbo: <b>life is</b>."),
 C("It ___ more freedom.",["means also","also means"],"also means","<b>also</b> delante del verbo."),
 C("It depends on how ___ organized.",["is the job","the job is"],"the job is","Dentro de una frase → <b>the job is</b>."),
 F("We discussed how could we work together.",[["how we could"]],["how could we"],"We discussed how we could work together.","Dentro de una frase → <b>we could</b>."),
 F("I work always alone.",[["always work"]],["work always"],"I always work alone.","<b>always</b> delante del verbo."),
 OK("It is also important to rest.","Correcta: con <i>is</i>, <b>also</b> va detrás."),
 T("No sé cómo es la vida en Boston.",[["what life is like","what living in boston is like","what life in boston is like"]],["how is"],"I don't know what life is like in Boston.","¿cómo es? → <b>what… is like</b>, con la cosa antes del verbo.")]},
{id:"r10",name:"10 · Comparar",tip:["Palabra corta → <b>-er / -est</b> (<i>easier, the highest</i>); larga → <b>more / the most</b>; nunca las dos","<b>the same as</b> · <b>different from</b> · <b>as… as</b>","<b>the more…, the -er…</b>"],items:[
 C("Shopping online is ___.",["more easy","easier","more easier"],"easier","<i>easy</i> → <b>easier</b> (sin <i>more</i>)."),
 C("Life today isn't the same ___ before.",["than","as"],"as","<b>the same as</b>."),
 C("Palladium had the ___ price of the three metals.",["higher","highest"],"highest","Tres o más → <b>-est</b>."),
 G("The more we use phones, the ___ it is to concentrate. (hard)",["harder"],"<b>the more…, the harder…</b>"),
 F("The most we read, the best we write.",[["the more we read"],["the better"]],["the most we"],"The more we read, the better we write.","<b>the more…, the better…</b>"),

// Endless practice: keeps serving items, weighted towards what you need most
function refillEndless(){
  const recent=new Set([...S.recent.slice(-30),...S.queue,S.cur].filter(Boolean)), td=today();
  const w=i=>{const b=box[i.id];if(b===undefined)return 3;if(b===0)return 6;if(b===1)return days[i.id]===td?0.8:4;return b>=4?0.25:0.6};
  let cand=ALL.filter(i=>!recent.has(i.id)).map(i=>({i,k:Math.pow(Math.random(),1/w(i))}));
  cand.sort((a,b)=>b.k-a.k);
  const perRule={},pick=[];
  for(const c of cand){if(pick.length>=10)break;const r=c.i.rule;if((perRule[r]||0)>=2)continue;perRule[r]=(perRule[r]||0)+1;pick.push(c.i.id)}

}

function check(it,val,claimOk){
  if(it.t==="choose") return val===it.a;
  if(it.t==="alt") return it.acc.includes(N(val).replace(/^the /,"the "));
  if(it.t==="gap"){
    if(it.acc.includes(N(val))) return true;
    const base=it.q.replace(/\s*\([^)]*\)\s*$/,"");
    const v=N(val);
    return it.acc.some(a=>{
      const full=N(base.replace(/_{2,}(\s*_{2,})?/,a));
      const before=N(base.split(/_{2,}/)[0]).split(" ").pop();
      if(v===full || (before && v===N(before+" "+a))) return true;
      // accept any answer made only of the question's own words plus the right answer
      const tok=x=>N(x).replace(/[^a-z0-9' ]/g," ").split(" ").filter(Boolean);
      const allowed=new Set([...tok(base),...tok(a)]);
      const vt=tok(val), at=tok(a);
      const hasA=(" "+vt.join(" ")+" ").includes(" "+at.join(" ")+" ");
      return hasA && vt.every(w=>allowed.has(w));
    });
  }
  if(it.t==="ok") return claimOk || N(val)===N(it.q);
  if(claimOk) return false;
  const v=" "+N(val)+" ";
  const allMust=it.must.every(alts=>alts.some(a=>v.includes(N(a))));
  const noBad=(it.not||[]).every(b=>!v.includes(N(b)));
  return allMust&&noBad;
}
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function fixTypos(it,val){
  const tok=x=>N(x).replace(/[^a-z0-9' ]/g," ").split(" ").filter(Boolean);

      if(it.t==="alt"&&!S.paraVal){if(N(v)!==N(it.orig)&&!check(it,v)){S.paraVal=v;render();return}return answer(v,false)}
      if(it.t==="para"||it.t==="alt"){if(lv==="3"&&SAMPLE){askClaude(S.paraVal);return}if(lv==="1"||lv==="✓")answer(S.paraVal,false,true);else if(lv==="2"||lv==="✗")answer(S.paraVal,false,false);else{inp.value="";inp.placeholder="Escribe 1 o 2"}return}
      if((it.t==="fix"||it.t==="ok")&&(lv==="ok"||lv==="="))return answer("",true);
      answer(v,false)};
    const ok=document.getElementById("okb"); if(ok) ok.onclick=()=>answer("",true);
    if(it.t==="choose"){inp.oninput=()=>{const lv=inp.value.trim().toLowerCase();const k="123456".indexOf(lv)>=0?+lv-1:"abcdef".indexOf(lv);if(lv&&k>=0&&k<it.opts.length)answer(it.opts[k],false)}}
    focusNow("in");}
  const nx=document.getElementById("nx"); if(nx){nx.onclick=next}
  const kf=document.getElementById("kf");
  const aib=document.getElementById("aib"); if(aib) aib.onclick=()=>askClaude(S.answered?S.lastVal:S.paraVal);
  const aiok=document.getElementById("aiok"); if(aiok) aiok.onclick=aiOverride;
  if(kf){kf.onsubmit=e=>{e.preventDefault();const kv=document.getElementById("kin").value.trim();if(kv==="?"&&SAMPLE&&!S.ai&&!S.lastOk){document.getElementById("kin").value="";askClaude(S.lastVal);return}next()};const k=focusNow("kin");
  }
  [60,350,700].forEach(t=>setTimeout(fitKb,t));
}
// Fit the card to the space above the iPhone keyboard
function fitKb(){
  const vv=window.visualViewport; if(!vv) return;
  const kbOpen=vv.height<window.innerHeight*0.85;
  document.body.style.paddingBottom=kbOpen?(window.innerHeight-vv.height+40)+"px":"";
  const card=app.querySelector(".card"); if(!card||!kbOpen) return;
  const top=el=>el.getBoundingClientRect().top+window.scrollY;
  const fb=app.querySelector(".fb"), inp=app.querySelector("#in,#pin");
  let y;
  if(fb) y=top(fb)-10;                                   // answered: show the correction
  else if(inp){const ib=top(inp)+inp.offsetHeight;        // show the question and the input
    y=Math.max(top(card)-8, ib-vv.height+16);}
  else y=top(card)-8;
  window.scrollTo(0,Math.max(0,y));
}
if(window.visualViewport) window.visualViewport.addEventListener("resize",()=>setTimeout(fitKb,30));
// Keyboard everywhere: number keys pick an option, Enter starts / goes to the next one
document.addEventListener("keydown",e=>{
  if(!S||e.metaKey||e.ctrlKey||e.altKey)return;
  const tag=(document.activeElement&&document.activeElement.tagName)||"";if(tag==="INPUT"||tag==="TEXTAREA")return;
  if(S.stage==="tip"&&e.key==="Enter"){e.preventDefault();S.stage="q";render();return}
  const it=S.cur&&ALL.find(i=>i.id===S.cur);if(!it)return;
  if(!S.answered&&it.t==="choose"){const k="123456".indexOf(e.key);if(k>=0&&k<it.opts.length){e.preventDefault();answer(it.opts[k],false)}return}
  if(S.answered&&e.key==="Enter"){e.preventDefault();next()}
});
render();
